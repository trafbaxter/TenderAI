global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # TenderAI API metrics
  - job_name: 'tenderai-api'
    static_configs:
      - targets: ['tenderai-api:8080']
    metrics_path: /metrics
    scrape_interval: 30s
    
  # n8n metrics
  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: /metrics
    scrape_interval: 30s
    
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
      
  # Node exporter (if needed)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']