# Google Cloud Build configuration for TenderAI Multi-Service Application
steps:
  # Build the Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'frontend/Dockerfile',
      '-t', 'gcr.io/$PROJECT_ID/tenderai-frontend:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/tenderai-frontend:latest',
      './frontend'
    ]

  # Build the Backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'backend/Dockerfile',
      '-t', 'gcr.io/$PROJECT_ID/tenderai-backend:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/tenderai-backend:latest',
      './backend'
    ]

  # Push Frontend image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tenderai-frontend:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tenderai-frontend:latest']

  # Push Backend image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tenderai-backend:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tenderai-backend:latest']

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'tenderai-frontend',
      '--image', 'gcr.io/$PROJECT_ID/tenderai-frontend:$BUILD_ID',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '512Mi',
      '--cpu', '1',
      '--max-instances', '10',
      '--min-instances', '0',
      '--concurrency', '80',
      '--timeout', '300',
      '--set-env-vars', 'NODE_ENV=production'
    ]

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'tenderai-backend',
      '--image', 'gcr.io/$PROJECT_ID/tenderai-backend:$BUILD_ID',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8000',
      '--memory', '1Gi',
      '--cpu', '1',
      '--max-instances', '10',
      '--min-instances', '1',
      '--concurrency', '80',
      '--timeout', '300',
      '--set-env-vars', 'N8N_BASE_URL=${N8N_BASE_URL},DATABASE_URL=${DATABASE_URL}'
    ]

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/tenderai-frontend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/tenderai-frontend:latest'
  - 'gcr.io/$PROJECT_ID/tenderai-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/tenderai-backend:latest'

# Build configuration
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '100'
  
timeout: '1200s'